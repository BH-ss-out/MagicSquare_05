# ##############################################################################
# Magic Square (4x4) — TDD 학습 프로젝트
#
# 본 파일은 PRD §13.2 자동화 게이트 카탈로그(OG-1 ~ OG-14)의 단일 진실 출처다.
# 임계값 변경은 PRD §13.7 + OPS-2(NFR 약화 금지)를 따른다.
# ##############################################################################

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magicsquare"
version = "0.1.0"
description = "4x4 마방진 판정/검증 — TDD + Dual-Track + Ops 학습 프로젝트"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MagicSquare Learner" }]
dependencies = []

[project.optional-dependencies]
# 개발/테스트/Ops 게이트 도구. PRD §13.2 OG-1 ~ OG-14에 직접 매핑.
dev = [
    "black>=24.0",          # OG-1: 포맷
    "ruff>=0.5",            # OG-2: lint (PEP 8 + pyflakes + PLR2004)
    "mypy>=1.10",           # OG-3: 타입 검사 (strict)
    "pytest>=8.0",          # OG-4: 단위 테스트
    "pytest-cov>=5.0",      # OG-5/OG-6: 커버리지
    "pre-commit>=3.7",      # 로컬 게이트 실행기 (OPS-1)
]

# 후속 확장 — Stage 3/4 게이트 활성화 시 추가
opt-strict = [
    "hypothesis>=6.0",      # OG-11: Property-based (선택)
    "import-linter>=2.0",   # OG-9: 의존성 방향 (선택)
]

[tool.setuptools.packages.find]
where = ["src"]

# ##############################################################################
# OG-1 — Black (코드 포맷)
# PRD §7 NFR-06 (매직 넘버는 별도 ruff PLR2004로 차단). 라인 길이는 .cursorrules.
# ##############################################################################
[tool.black]
line-length = 88
target-version = ["py310"]

# ##############################################################################
# OG-2 — Ruff (PEP 8 + pyflakes + PLR2004 매직 넘버 금지 → NFR-06 보호)
# ##############################################################################
[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
# 활성 룰셋 — NFR-06 (PLR2004 매직 넘버 금지)을 PL 그룹으로 강제한다.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import 정렬)
    "N",   # pep8-naming
    "PL",  # pylint (PLR2004 포함 — 매직 넘버 금지)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# 테스트는 매직 넘버 일부 허용 (예: AAA의 입력값 4, 16, 34 등).
# 단, 도메인 상수는 *상수 모듈에서 import* 해야 하므로 PLR2004는 유지하되 임계값을 완화한다.
"tests/**/*.py" = ["PLR2004"]

[tool.ruff.lint.pylint]
# 매직 넘버 허용 목록 — 본 PRD에서 *논의 끝에 의도적으로 허용*된 값만 등록한다.
allow-magic-value-types = ["str", "bytes"]

# ##############################################################################
# OG-3 — mypy (--strict 동치 설정)
# .cursorrules `type_hints.enforcement: mypy --strict 통과를 권장`
# ##############################################################################
[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
check_untyped_defs = true
extra_checks = true

# 외부 라이브러리 stubs 누락 시 무시
[[tool.mypy.overrides]]
module = ["hypothesis.*", "pytest_cov.*"]
ignore_missing_imports = true

# ##############################################################################
# OG-4 — pytest (단위 테스트 통과)
# OG-5/OG-6 — pytest-cov (Domain ≥ 95% / Boundary ≥ 85%)
#
# ※ 초기 임계값 정책:
#   - 본 프로젝트는 *현재 테스트 0건* 상태에서 시작한다 (TDD RED 직전).
#   - PRD §13.7 OPS-2: NFR 약화 금지. 단 *초기값 0*은 *약화*가 아닌 *미설정 상태*다.
#   - 첫 GREEN 진입(Track A 또는 B의 RED→GREEN) 직후 PR로 95/85로 *상향*한다 (강화는 자유).
# ##############################################################################
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=magicsquare",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=0",
]
markers = [
    "boundary: Track A — Boundary(UI) tests (PRD §8.1)",
    "domain: Track B — Domain(Logic) tests (PRD §8.2)",
    "invariant: Invariant tests (T-INV-*) (PRD §8.2.2)",
    "property: Property-based tests (P-01 ~ P-08) (PRD §9.4)",
    "slow: Tests intentionally slow (e.g., 100x determinism repeat)",
]

[tool.coverage.run]
branch = true
source = ["src/magicsquare"]
omit = [
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
